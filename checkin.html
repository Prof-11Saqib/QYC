<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Check-in — Quranic Youth Camp</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/checkin.css"/>
</head>
<body>

  <div class="hdr">
    <div class="icon-strip">🌙 ☪️ 📖 ✨ 🕌</div>
    <h1>Quranic <span>Youth Camp</span></h1>
    <p>Venue Entry Check</p>
    <div class="hdr-badge">🎟️ Camp day access</div>
  </div>

  <nav class="nav">
    <a class="nav-btn" href="register.html">📝 Register</a>
    <a class="nav-btn" href="admin.html">🔐 Admin</a>
    <a class="nav-btn active" href="checkin.html">✅ Check-in</a>
  </nav>

  <div class="main">
    <div class="card">
      <div class="card-title">🎟️ Verify Entry</div>
      <p class="ci-sub">Ask the child or parent their name and age, then verify below.</p>
      <div class="row">
        <div class="field">
          <label>Child's name</label>
          <input type="text" id="ci-name" placeholder="Enter name" oninput="clearResult()"/>
        </div>
        <div class="field">
          <label>Age</label>
          <input type="number" id="ci-age" placeholder="Age" min="14" max="24" oninput="clearResult()"/>
        </div>
      </div>
      <button class="btn btn-primary" onclick="doCheckin()">Verify Entry 🔍</button>
    </div>

    <div id="ci-result" style="display:none"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/checkin.js"></script>
</body>
</html>
