<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Check-in — Quranic Youth Camp</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/checkin.css"/>
</head>
<body>

<div class="hdr">
  <div class="icon-strip">🌙 ☪️ 📖 ✨ 🕌</div>
  <h1>Quranic <span>Youth Camp</span></h1>
  <p>Venue Entry Check</p>
  <div class="hdr-badge">🎟️ Camp day only</div>
</div>

<nav class="nav">
  <a href="register.html" class="nav-btn">📝 Register</a>
  <!-- <a href="admin.html"    class="nav-btn">🔐 Admin</a> -->
  <a href="checkin.html"  class="nav-btn active">✅ Check-in</a>
</nav>

<div class="main">
  <div class="card">
    <div class="card-title">🎟️ Venue entry check</div>
    <!-- <p style="font-size:13px;color:#6e7681;margin-bottom:1rem">Ask the child or parent their name and age, then verify below.</p> -->
    <div class="row">
      <div class="field">
        <label>participant's name</label>
        <input type="text" id="ci-name" placeholder="Enter name" oninput="clearCI()"/>
      </div>
      <div class="field">
        <label>Age</label>
        <input type="number" id="ci-age" placeholder="Age" min="14" max="24" oninput="clearCI()"/>
      </div>
    </div>
    <button class="btn btn-primary" onclick="doCheckin()">Verify entry </button>
  </div>

  <div id="ci-result" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/checkin.js"></script>
</body>
</html>
